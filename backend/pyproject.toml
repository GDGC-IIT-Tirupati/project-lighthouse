[project]
name = "backend"
version = "0.1.0"
description = "Project Lighthouse backend service"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "alembic>=1.18.4",
    "fastapi[standard]>=0.136.0",
    "firebase-admin>=7.1.0",
    "pgvector>=0.4.2",
    "psycopg2-binary>=2.9.11",
    "python-dotenv>=1.2.2",
    "sqlalchemy>=2.0.49",
]

[dependency-groups]
dev = [
    "ruff>=0.13.2",
]

[tool.uv]
package = false
